name: her
description: "A deeply personal period tracker + emotional companion app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.0.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.0.0
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  rive: ^0.13.0
  google_fonts: ^6.2.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0
  flutter_svg: ^2.0.10+1
  just_audio: ^0.9.40
  record: ^5.1.0
  audio_waveforms: ^1.0.5
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  uuid: ^4.5.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  connectivity_plus: ^6.0.5
  fl_chart: ^0.68.0
  confetti: ^0.7.0
  flutter_markdown: ^0.7.7+1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/illustrations/

dependency_overrides:
  record_linux: ^1.3.1
  record_windows: ^1.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "app_icon.png"
